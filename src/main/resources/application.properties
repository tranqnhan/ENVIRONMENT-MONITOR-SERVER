spring.application.name=environment_monitor_server

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

app.bootstrap.serverAdminUsername=${SERVER_ADMIN_USERNAME}
app.bootstrap.serverAdminPassword=${SERVER_ADMIN_PASSWORD}

server.address=0.0.0.0
server.port=8080

server.ssl.enabled=true
server.ssl.key-store=file:./server.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=local-server